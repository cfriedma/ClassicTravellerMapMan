services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ctmm
      POSTGRES_PASSWORD: ctmm
      POSTGRES_DB: ctmm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctmm -d ctmm"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ctmm:ctmm@db:5432/ctmm
    depends_on:
      db:
        condition: service_healthy
